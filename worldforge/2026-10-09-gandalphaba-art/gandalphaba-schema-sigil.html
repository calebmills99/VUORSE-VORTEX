<head>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;

        /* Parameter Controls */
        .control-group {

        .control-group label {
            display: block;

            font-weight: 500;

        .slider-container {
            display: flex;

            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);

        }

        .color-picker-container {
            display: flex;

        .color-picker-container input[type="color"] {
            width: 32px;

            border: none;
            border-radius: 6px;

        }

        .color-value {
            font-family: 'Courier New', monospace;

        /* Buttons */
        .button {

        .button:hover {

        .button:active {

        .button.secondary {

        .button.secondary:hover {

        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            min-height: 400px;
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers (CUSTOMIZE THIS FOR YOUR ART) -->
            <h1>Schema Sigil</h1>
            <div class="subtitle">A Sealcraft production-design study: Gray Eye hero read, provenance rigging, seal props, and temporal stage architecture.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <div class="button-row">
                    <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
                    <button class="button tertiary regen-button" onclick="updateSeed()">Go</button>
                </div>
            </div>

            <!-- Parameters Section (CUSTOMIZE THIS FOR YOUR ART) -->
            <div class="control-section">
                <h3>Parameters</h3>
                
                <div class="control-group">
                    <label>Node Count</label>
                    <div class="slider-container">
                        <input type="range" id="nodeCount" min="24" max="140" step="4" value="72" oninput="updateParam('nodeCount', this.value)">
                        <span class="value-display" id="nodeCount-value">72</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Seal Strength</label>
                    <div class="slider-container">
                        <input type="range" id="sealStrength" min="0.2" max="1.8" step="0.05" value="1.05" oninput="updateParam('sealStrength', this.value)">
                        <span class="value-display" id="sealStrength-value">1.05</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Provenance Pull</label>
                    <div class="slider-container">
                        <input type="range" id="provenancePull" min="0.1" max="1.6" step="0.05" value="0.85" oninput="updateParam('provenancePull', this.value)">
                        <span class="value-display" id="provenancePull-value">0.85</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Temporal Shear</label>
                    <div class="slider-container">
                        <input type="range" id="temporalShear" min="0" max="1.4" step="0.05" value="0.55" oninput="updateParam('temporalShear', this.value)">
                        <span class="value-display" id="temporalShear-value">0.55</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Glamour Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="glamourTurbulence" min="0" max="1.7" step="0.05" value="0.7" oninput="updateParam('glamourTurbulence', this.value)">
                        <span class="value-display" id="glamourTurbulence-value">0.7</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Acid Accent Intensity</label>
                    <div class="slider-container">
                        <input type="range" id="acidAccent" min="0" max="1" step="0.02" value="0.56" oninput="updateParam('acidAccent', this.value)">
                        <span class="value-display" id="acidAccent-value">0.56</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Coverage Gate</label>
                    <div class="slider-container">
                        <input type="range" id="coverageGate" min="1" max="3" step="1" value="2" oninput="updateParam('coverageGate', this.value)">
                        <span class="value-display" id="coverageGate-value">2</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section (OPTIONAL - CUSTOMIZE OR REMOVE) -->
            <div class="control-section">
                <h3>Colors</h3>
                
                <div class="color-group">
                    <label>Smoke Field</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#2b2735" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#2b2735</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Parchment Gold</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#c7a766" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#c7a766</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Validator Fire</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#b8ff36" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#b8ff36</span>
                    </div>

            <!-- Actions Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Actions</h3>

                    <button class="button" onclick="regenerateArtwork()">Regenerate</button>

        <!-- Main Canvas Area -->

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART PARAMETERS - CUSTOMIZE FOR YOUR ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            nodeCount: 72,
            sealStrength: 1.05,
            provenancePull: 0.85,
            temporalShear: 0.55,
            glamourTurbulence: 0.7,
            acidAccent: 0.56,
            coverageGate: 2,
            colorPalette: ['#2b2735', '#c7a766', '#b8ff36']
        };

        let defaultParams = JSON.parse(JSON.stringify(params)); // Store defaults for reset

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS GENERATIVE ART ALGORITHM - REPLACE WITH YOUR VISION
        // ═══════════════════════════════════════════════════════════════════════

        let nodes = [];
        let edges = [];
        let seals = [];
        let seamBands = [];
        let stageArcs = [];
        let conflictTensions = [];
        let glyphs = ['src', 'st', 'rel', 'act', 'rank', 'seal', 'prov'];
        let rankWeights = { preferred: 1.4, normal: 0.9, deprecated: 0.45 };

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            pixelDensity(1);
            textFont('Lora');
            initializeSystem();
            
            // Remove loading message
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            // Seed the randomness for reproducibility
            randomSeed(params.seed);
            noiseSeed(params.seed);
            nodes = [];
            edges = [];
            seals = [];
            seamBands = [];
            stageArcs = [];
            conflictTensions = [];

            let center = createVector(width * 0.5, height * 0.5);
            let rings = [145, 255, 372, 485];
            let acidChance = 0.08 + params.acidAccent * 0.16;

            for (let i = 0; i < params.nodeCount; i++) {
                let ringIndex = floor(random(rings.length));
                let phase = (TWO_PI * i / params.nodeCount) + random(-0.4, 0.4);
                let radius = rings[ringIndex] + random(-36, 36);
                let shear = sin(phase * 2.0 + ringIndex) * params.temporalShear * 70;
                let turbulence = noise(i * 0.17, params.seed * 0.001) - 0.5;
                let x = center.x + cos(phase) * radius + shear;
                let y = center.y + sin(phase) * radius + turbulence * params.glamourTurbulence * 160;
                let rankRoll = random();
                let rank = rankRoll > 0.84 ? 'preferred' : (rankRoll < 0.16 ? 'deprecated' : 'normal');
                let kind = random(['claim', 'source', 'relationship', 'activity']);

                nodes.push({
                    id: i,
                    pos: createVector(x, y),
                    vel: createVector(0, 0),
                    home: createVector(x, y),
                    ring: ringIndex,
                    rank: rank,
                    kind: kind,
                    sealed: random() < (0.22 + params.sealStrength * 0.13),
                    acid: false,
                    support: 0,
                    conflict: random() < 0.12 && kind !== 'source',
                    mass: random(0.8, 1.5) * rankWeights[rank],
                    glyph: random(glyphs)
                });
            }

            for (let i = 0; i < nodes.length; i++) {
                let targetCount = nodes[i].kind === 'source' ? 3 : floor(random(1, 4));
                for (let j = 0; j < targetCount; j++) {
                    let bias = floor(random(-9, 10));
                    let target = (i + nodes.length + bias + floor(random(nodes.length * 0.18))) % nodes.length;
                    if (target !== i) {
                        edges.push({
                            from: i,
                            to: target,
                            weight: random(0.25, 1.0) * params.provenancePull,
                            temporal: random(-1, 1),
                            sealed: nodes[i].sealed || nodes[target].sealed,
                            coherent: false
                        });
                        if (nodes[i].kind === 'source') {
                            nodes[target].support += 1;
                        }
                        if (nodes[target].kind === 'source') {
                            nodes[i].support += 1;
                        }
                    }
                }
            }

            for (let edge of edges) {
                let a = nodes[edge.from];
                let b = nodes[edge.to];
                edge.coherent = a.support >= params.coverageGate && b.support >= params.coverageGate && !a.conflict && !b.conflict;
            }

            for (let node of nodes) {
                node.acid = node.support >= params.coverageGate && !node.conflict && random() < acidChance;
            }

            let conflictNodes = nodes.filter((node) => node.conflict);
            for (let i = 0; i < conflictNodes.length; i++) {
                let a = conflictNodes[i];
                let b = nodes[(a.id + floor(random(5, nodes.length - 5))) % nodes.length];
                if (b && b.id !== a.id) {
                    conflictTensions.push({ from: a.id, to: b.id, twist: random(-1, 1) });
                }
            }

            for (let i = 0; i < 72; i++) {
                seamBands.push({
                    angle: random(TWO_PI),
                    distance: random(115, 530),
                    width: random(0.5, 2.4),
                    offset: random(-80, 80),
                    alpha: random(12, 42)
                });
            }

            for (let i = 0; i < 9; i++) {
                stageArcs.push({
                    radius: 210 + i * 38 + random(-12, 12),
                    start: -PI * 0.86 + random(-0.08, 0.08),
                    end: PI * 0.86 + random(-0.08, 0.08),
                    lift: random(-34, 34),
                    weight: random(0.7, 2.1)
                });
            }

            for (let i = 0; i < 7; i++) {
                seals.push({
                    angle: i * TWO_PI / 7 + random(-0.18, 0.18),
                    radius: random(130, 430),
                    size: random(38, 88) * params.sealStrength,
                    turns: floor(random(3, 8))
                });
            }

            relaxGraph();
            redraw();
            noLoop();
        }

        function relaxGraph() {
            let center = createVector(width * 0.5, height * 0.5);
            for (let step = 0; step < 70; step++) {
                for (let edge of edges) {
                    let a = nodes[edge.from];
                    let b = nodes[edge.to];
                    let desired = map((a.ring + b.ring) * 0.5, 0, 3, 80, 210);
                    let delta = p5.Vector.sub(b.pos, a.pos);
                    let d = max(delta.mag(), 1);
                    let force = (d - desired) * 0.0025 * edge.weight;
                    delta.normalize().mult(force);
                    a.vel.add(delta);
                    b.vel.sub(delta);
                }

                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        let a = nodes[i];
                        let b = nodes[j];
                        let delta = p5.Vector.sub(b.pos, a.pos);
                        let d = max(delta.mag(), 1);
                        if (d < 56) {
                            delta.normalize().mult((56 - d) * 0.008);
                            a.vel.sub(delta);
                            b.vel.add(delta);
                        }
                    }
                }

                for (let n of nodes) {
                    let toHome = p5.Vector.sub(n.home, n.pos).mult(0.018);
                    let toCenter = p5.Vector.sub(center, n.pos).mult(0.0009 * params.sealStrength);
                    n.vel.add(toHome).add(toCenter);
                    n.pos.add(n.vel);
                    n.vel.mult(0.78);
                }
            }
        }

        function draw() {
            drawGround();
            drawStageArchitecture();
            drawTemporalSeams();
            drawConflictTensions();
            drawProvenanceEdges();
            drawSealRings();
            drawNodes();
            drawGrayEye();
            drawMarginalia();
        }

        function drawGround() {
            background(250, 249, 245);
            let smoke = color(params.colorPalette[0]);
            noStroke();
            for (let i = 0; i < 1800; i++) {
                let x = random(width);
                let y = random(height);
                let d = random(0.4, 2.2);
                fill(red(smoke), green(smoke), blue(smoke), random(5, 18));
                circle(x, y, d);
            }

            push();
            translate(width / 2, height / 2);
            noFill();
            stroke(43, 39, 53, 22);
            for (let r = 120; r < 560; r += 44) {
                strokeWeight(r % 88 === 0 ? 1.4 : 0.6);
                ellipse(0, 0, r * 2, r * 2);
            }
            pop();
        }

        function drawStageArchitecture() {
            let smoke = color(params.colorPalette[0]);
            let gold = color(params.colorPalette[1]);
            let silver = color('#c3c4bd');
            push();
            translate(width / 2, height / 2);
            noFill();
            for (let i = 0; i < stageArcs.length; i++) {
                let arcData = stageArcs[i];
                let material = i % 3 === 0 ? silver : (i % 3 === 1 ? smoke : gold);
                let alpha = i % 3 === 0 ? 72 : 42;
                stroke(red(material), green(material), blue(material), alpha);
                strokeWeight(arcData.weight);
                arc(0, arcData.lift, arcData.radius * 2.05, arcData.radius * 1.46, arcData.start, arcData.end);
            }

            stroke(red(silver), green(silver), blue(silver), 50);
            strokeWeight(1.1);
            for (let a = -PI * 0.78; a <= PI * 0.78; a += PI / 8) {
                line(cos(a) * 118, sin(a) * 80, cos(a) * 545, sin(a) * 420);
            }
            pop();
        }

        function drawTemporalSeams() {
            let smoke = color(params.colorPalette[0]);
            push();
            translate(width / 2, height / 2);
            for (let band of seamBands) {
                rotate(0.003 * params.temporalShear);
                let alpha = band.alpha * (0.6 + params.temporalShear);
                stroke(red(smoke), green(smoke), blue(smoke), alpha);
                strokeWeight(band.width);
                let wiggle = sin(band.angle * 3 + params.seed) * params.temporalShear * 28;
                line(
                    cos(band.angle) * -620 + band.offset,
                    sin(band.angle) * -620 + wiggle,
                    cos(band.angle) * 620 + band.offset,
                    sin(band.angle) * 620 - wiggle
                );
            }
            pop();
        }

        function drawProvenanceEdges() {
            let gold = color(params.colorPalette[1]);
            let acid = color(params.colorPalette[2]);
            noFill();
            for (let edge of edges) {
                let a = nodes[edge.from];
                let b = nodes[edge.to];
                let mid = p5.Vector.lerp(a.pos, b.pos, 0.5);
                let dx = b.pos.x - a.pos.x;
                let dy = b.pos.y - a.pos.y;
                let bend = createVector(-dy, dx).normalize().mult(edge.temporal * params.temporalShear * 70);

                if (edge.sealed && edge.coherent) {
                    stroke(red(acid), green(acid), blue(acid), 32 + params.acidAccent * 70);
                    strokeWeight(0.6 + edge.weight);
                } else {
                    stroke(red(gold), green(gold), blue(gold), 32 + edge.weight * 42);
                    strokeWeight(0.45 + edge.weight * 0.8);
                }

                bezier(
                    a.pos.x, a.pos.y,
                    mid.x + bend.x, mid.y + bend.y,
                    mid.x - bend.x, mid.y - bend.y,
                    b.pos.x, b.pos.y
                );
            }
        }

        function drawConflictTensions() {
            let smoke = color(params.colorPalette[0]);
            let silver = color('#c3c4bd');
            noFill();
            drawingContext.setLineDash([7, 8]);
            for (let tension of conflictTensions) {
                let a = nodes[tension.from];
                let b = nodes[tension.to];
                if (!a || !b) continue;
                let mid = p5.Vector.lerp(a.pos, b.pos, 0.5);
                let dx = b.pos.x - a.pos.x;
                let dy = b.pos.y - a.pos.y;
                let bend = createVector(-dy, dx).normalize().mult(tension.twist * 52);
                stroke(red(silver), green(silver), blue(silver), 58);
                strokeWeight(1.1);
                bezier(a.pos.x, a.pos.y, mid.x + bend.x, mid.y + bend.y, mid.x - bend.x, mid.y - bend.y, b.pos.x, b.pos.y);
                stroke(red(smoke), green(smoke), blue(smoke), 44);
                strokeWeight(0.8);
                bezier(a.pos.x, a.pos.y, mid.x - bend.x, mid.y - bend.y, mid.x + bend.x, mid.y + bend.y, b.pos.x, b.pos.y);
            }
            drawingContext.setLineDash([]);
        }

        function drawSealRings() {
            let center = createVector(width * 0.5, height * 0.5);
            let gold = color(params.colorPalette[1]);
            let acid = color(params.colorPalette[2]);
            push();
            translate(center.x, center.y);
            noFill();
            for (let seal of seals) {
                let x = cos(seal.angle) * seal.radius;
                let y = sin(seal.angle) * seal.radius;
                push();
                translate(x, y);
                rotate(seal.angle + params.temporalShear * 0.3);
                for (let t = 0; t < seal.turns; t++) {
                    let alpha = 42 + t * 11;
                    stroke(red(gold), green(gold), blue(gold), alpha);
                    strokeWeight(0.8);
                    rectMode(CENTER);
                    let s = seal.size + t * 7;
                    rect(0, 0, s, s, s * 0.16);
                    stroke(red(acid), green(acid), blue(acid), alpha * params.acidAccent);
                    arc(0, 0, s * 1.32, s * 1.32, -PI * 0.15, PI * 0.32);
                }
                pop();
            }
            pop();
        }

        function drawNodes() {
            let smoke = color(params.colorPalette[0]);
            let gold = color(params.colorPalette[1]);
            let acid = color(params.colorPalette[2]);
            let silver = color('#c3c4bd');
            textAlign(CENTER, CENTER);

            for (let n of nodes) {
                let base = n.kind === 'source' ? gold : smoke;
                let nodeSize = 5 + n.mass * 6 + (n.sealed ? params.sealStrength * 4 : 0) + (n.kind === 'source' ? 5 : 0);
                let alpha = n.rank === 'deprecated' ? 88 : 178;
                noStroke();
                fill(red(base), green(base), blue(base), alpha);

                if (n.kind === 'source') {
                    push();
                    translate(n.pos.x, n.pos.y);
                    rotate(PI / 4 + noise(n.id, params.seed) * 0.35);
                    rectMode(CENTER);
                    rect(0, 0, nodeSize * 1.25, nodeSize * 1.25, 2);
                    stroke(red(silver), green(silver), blue(silver), 82);
                    strokeWeight(0.8);
                    line(-nodeSize * 0.5, 0, nodeSize * 0.5, 0);
                    pop();
                } else if (n.kind === 'relationship') {
                    push();
                    translate(n.pos.x, n.pos.y);
                    rotate(noise(n.id, params.seed) * TWO_PI);
                    triangle(-nodeSize, nodeSize * 0.7, 0, -nodeSize, nodeSize, nodeSize * 0.7);
                    pop();
                } else if (n.kind === 'activity') {
                    rectMode(CENTER);
                    rect(n.pos.x, n.pos.y, nodeSize * 1.4, nodeSize * 0.9, 2);
                } else {
                    circle(n.pos.x, n.pos.y, nodeSize);
                }

                if (n.sealed) {
                    noFill();
                    stroke(red(gold), green(gold), blue(gold), 110);
                    strokeWeight(1.1);
                    circle(n.pos.x, n.pos.y, nodeSize * 2.2);
                }

                if (n.conflict) {
                    noFill();
                    stroke(red(silver), green(silver), blue(silver), 132);
                    strokeWeight(1.3);
                    line(n.pos.x - nodeSize, n.pos.y - nodeSize, n.pos.x + nodeSize, n.pos.y + nodeSize);
                    line(n.pos.x + nodeSize, n.pos.y - nodeSize, n.pos.x - nodeSize, n.pos.y + nodeSize);
                }

                if (n.support >= params.coverageGate && !n.conflict) {
                    noFill();
                    stroke(red(gold), green(gold), blue(gold), 46);
                    strokeWeight(0.9);
                    circle(n.pos.x, n.pos.y, nodeSize * 2.9);
                }

                if (n.acid) {
                    fill(red(acid), green(acid), blue(acid), 145 + params.acidAccent * 80);
                    noStroke();
                    circle(n.pos.x, n.pos.y, max(2, nodeSize * 0.34));
                }
            }
        }

        function drawGrayEye() {
            let smoke = color(params.colorPalette[0]);
            let gold = color(params.colorPalette[1]);
            let acid = color(params.colorPalette[2]);
            let silver = color('#c3c4bd');
            push();
            translate(width / 2, height / 2);
            drawingContext.shadowColor = 'rgba(20, 20, 19, 0.18)';
            drawingContext.shadowBlur = 28;
            fill(250, 249, 245, 235);
            stroke(red(gold), green(gold), blue(gold), 120);
            strokeWeight(2);
            ellipse(0, 0, 330, 208);
            drawingContext.shadowBlur = 0;

            noFill();
            stroke(red(silver), green(silver), blue(silver), 210);
            strokeWeight(4.2);
            beginShape();
            for (let a = -PI; a <= 0; a += 0.04) {
                vertex(cos(a) * 142, sin(a) * 62);
            }
            for (let a = 0; a <= PI; a += 0.04) {
                vertex(cos(a) * 142, sin(a) * -62);
            }
            endShape(CLOSE);

            stroke(red(smoke), green(smoke), blue(smoke), 145);
            strokeWeight(1.4);
            circle(0, 0, 114);
            stroke(red(gold), green(gold), blue(gold), 150);
            circle(0, 0, 82);
            fill(red(smoke), green(smoke), blue(smoke), 188);
            noStroke();
            circle(0, 0, 42);
            fill(red(acid), green(acid), blue(acid), 130 + params.acidAccent * 80);
            circle(0, 0, 12 + params.acidAccent * 15);
            noFill();
            stroke(red(acid), green(acid), blue(acid), 68 + params.acidAccent * 88);
            strokeWeight(1.2);
            arc(0, 0, 174, 112, -PI * 0.18, PI * 0.24);
            pop();
        }

        function drawMarginalia() {
            let smoke = color(params.colorPalette[0]);
            let gold = color(params.colorPalette[1]);
            let acid = color(params.colorPalette[2]);
            textSize(14);
            textAlign(CENTER, CENTER);
            for (let i = 0; i < glyphs.length; i++) {
                let angle = i * TWO_PI / glyphs.length - PI / 2;
                let x = width / 2 + cos(angle) * 548;
                let y = height / 2 + sin(angle) * 548;
                fill(red(smoke), green(smoke), blue(smoke), 112);
                noStroke();
                text(glyphs[i], x, y);
            }

            textSize(11);
            fill(red(gold), green(gold), blue(gold), 150);
            text('STEWARD SEALS / GANDIE IMPLEMENTS / SEED ' + params.seed, width / 2, height - 44);
            fill(red(acid), green(acid), blue(acid), 95 + params.acidAccent * 70);
            text('source before sparkle / validator green waits for coverage', width / 2, height - 24);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS - CUSTOMIZE FOR YOUR PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            let next = parseFloat(value);
            params[paramName] = (paramName === 'nodeCount' || paramName === 'coverageGate') ? parseInt(next, 10) : next;
            let display = document.getElementById(paramName + '-value');
            display.textContent = (paramName === 'nodeCount' || paramName === 'coverageGate') ? params[paramName] : params[paramName].toFixed(2);
            initializeSystem();
        }

        function updateColor(colorId, value) {
            let index = colorId === 'color1' ? 0 : (colorId === 'color2' ? 1 : 2);
            params.colorPalette[index] = value;
            document.getElementById(colorId + '-value').textContent = value;
            initializeSystem();
        }

        function regenerateArtwork() {
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('gandalphaba-schema-sigil-seed-' + params.seed, 'png');
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS - ALWAYS KEEP THESE
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value, 10);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                // Reset to current seed if invalid
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            
            // Update UI elements
            document.getElementById('nodeCount').value = params.nodeCount;
            document.getElementById('nodeCount-value').textContent = params.nodeCount;
            document.getElementById('sealStrength').value = params.sealStrength;
            document.getElementById('sealStrength-value').textContent = params.sealStrength.toFixed(2);
            document.getElementById('provenancePull').value = params.provenancePull;
            document.getElementById('provenancePull-value').textContent = params.provenancePull.toFixed(2);
            document.getElementById('temporalShear').value = params.temporalShear;
            document.getElementById('temporalShear-value').textContent = params.temporalShear.toFixed(2);
            document.getElementById('glamourTurbulence').value = params.glamourTurbulence;
            document.getElementById('glamourTurbulence-value').textContent = params.glamourTurbulence.toFixed(2);
            document.getElementById('acidAccent').value = params.acidAccent;
            document.getElementById('acidAccent-value').textContent = params.acidAccent.toFixed(2);
            document.getElementById('coverageGate').value = params.coverageGate;
            document.getElementById('coverageGate-value').textContent = params.coverageGate;
            
            // Reset colors
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];
            
            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
