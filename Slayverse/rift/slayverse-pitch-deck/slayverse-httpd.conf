# SLAYVERSE Pitch Deck — Apache Configuration
# Start: httpd -f "C:/Users/nobby.CALEBPC/Documents/slayverse-pitch-deck/slayverse-httpd.conf"
# View:  http://localhost:8080

ServerRoot "C:/Users/nobby.CALEBPC/scoop/apps/apache/current"
Listen 8080
ServerName localhost:8080

# Core modules
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule alias_module modules/mod_alias.so
LoadModule actions_module modules/mod_actions.so
LoadModule cgi_module modules/mod_cgi.so

# PHP via CGI
ScriptAlias /php-cgi/ "C:/Users/nobby.CALEBPC/scoop/apps/php/current/"
AddType application/x-httpd-php .php
Action application/x-httpd-php "/php-cgi/php-cgi.exe"

# Document root
DocumentRoot "C:/Users/nobby.CALEBPC/Documents/slayverse-pitch-deck"

<Directory "C:/Users/nobby.CALEBPC/Documents/slayverse-pitch-deck">
    Options Indexes FollowSymLinks ExecCGI
    AllowOverride All
    Require all granted
    DirectoryIndex site-index.php site-index.html index.php index.html
</Directory>

<Directory "C:/Users/nobby.CALEBPC/scoop/apps/php/current">
    AllowOverride None
    Options None
    Require all granted
</Directory>

# MIME types
TypesConfig conf/mime.types
AddType text/html .html .htm
AddType text/css .css
AddType application/javascript .js
AddType image/png .png
AddType image/jpeg .jpg .jpeg

# Logging
ErrorLog "C:/Users/nobby.CALEBPC/Documents/slayverse-pitch-deck/error.log"
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "C:/Users/nobby.CALEBPC/Documents/slayverse-pitch-deck/access.log" common
