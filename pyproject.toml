[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vuorse-vortex"
version = "0.1.0"
description = "Cloud-scale anti-erasure cognition architecture for the Slayverse universe"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "VUORSE-VORTEX Contributors" }]
keywords = ["slayverse", "narrative-intelligence", "anti-erasure", "velvet-archive"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer[all]>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "chromadb>=0.5",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "structlog>=24.2",
    "orjson>=3.10",
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "anyio>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
gpu = [
    "cupy-cuda12x>=13.0",
]

[project.scripts]
vortex = "vuorse_vortex.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vuorse_vortex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/vuorse_vortex"]
omit = ["tests/*"]
